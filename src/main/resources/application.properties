
# === Application ===
spring.application.name=notification-service

# === Server Port ===
server.port=8084

# === PostgreSQL Database Configuration ===
# Local: localhost:5432
# Docker: notification-postgres:5432

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate Configuration ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# === JWT Configuration ===
# Must be identical to IdentityService
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_THE_SAME_SECRET_AS_IDENTITY_SERVICE}

# === Email Configuration ===
# Disabled by default (log only)
# Set MAIL_ENABLED=true to activate email sending

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@tenderflow.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
